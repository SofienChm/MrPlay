name: mrplay
description: "Multi-platform video hub with background audio"
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State
  flutter_riverpod: ^2.5.1

  # Web engine & media
  flutter_inappwebview: ^6.1.5
  audio_session: ^0.1.21
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  fl_chart: ^1.2.0

  # System integrations
  url_launcher: ^6.2.4
  share_plus: ^10.1.4
  home_widget: 0.7.0+1
  receive_sharing_intent: ^1.7.2

  # Ads, consent & analytics
  google_mobile_ads: ^5.1.0
  gma_mediation_applovin: ^2.1.0
  gma_mediation_meta: ^1.1.0
  app_tracking_transparency: ^2.0.7
  firebase_core: 4.13.0
  firebase_analytics: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/js/
