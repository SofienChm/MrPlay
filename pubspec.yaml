name: mrplay
description: "Multi-platform video hub with background audio"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_inappwebview: ^6.1.5
  audio_session: ^0.1.21
  audioplayers: ^6.1.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.4.0
  json_annotation: ^4.8.1
  flutter_svg: ^2.0.9
  url_launcher: ^6.2.4
  share_plus: ^10.1.4
  path_provider: ^2.1.2
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  google_mobile_ads: ^5.1.0
  home_widget: 0.7.0+1
  receive_sharing_intent: ^1.7.2
  fl_chart: ^1.2.0
  firebase_core: ^4.13.0
  firebase_remote_config: ^6.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/audio/
