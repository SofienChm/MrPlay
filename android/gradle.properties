org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Some Flutter plugins target Java 8/17 while the Kotlin 2.x compiler on JDK 21
# defaults to jvmTarget 21. Downgrade the JVM target mismatch check from error to
# warning so the build proceeds; Android's D8/R8 accepts the mixed bytecode.
kotlin.jvm.target.validation.mode=warning
